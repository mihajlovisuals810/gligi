<!DOCTYPE html><html lang="sr"><head><meta charset="utf-8"><title>GLIGIMP4 HQ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--s1:#131315;--s2:#1b1b1e;--ln:#28282c;--tx:#f2f2f0;--mu:#8e8e96;--or:#ff6b00;--or2:#ff8a33;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100%}
aside{width:236px;flex:none;background:var(--s1);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px 22px}.brand img{width:46px;height:46px;border-radius:11px;flex:none}
.brand b{font-weight:800;letter-spacing:-.02em;font-size:15px;display:block}.brand small{color:var(--mu);font-size:11px}
nav{flex:1}nav a{display:block;padding:9px 12px;color:var(--mu);text-decoration:none;border-radius:6px;font-weight:500;position:relative;transition:.15s}
nav a:hover,nav a.on{color:var(--tx);background:var(--s2)}
nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--or);border-radius:0 3px 3px 0}
main{flex:1;overflow:auto;padding:34px 42px 70px;min-width:0}.w{max-width:1180px;margin:auto}
h1{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}.ph p{color:var(--mu);margin-top:2px}
.btn{font:inherit;font-weight:600;font-size:13px;background:var(--s2);color:var(--tx);border:1px solid var(--ln);padding:8px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;transition:.15s}
.btn:hover{border-color:#4a4a50}.btn.pri{background:var(--or);border-color:var(--or);color:#140800}.btn.pri:hover{background:var(--or2)}
.btn.sm{padding:3px 9px;font-size:12px}.btn.d:hover{border-color:#ef4444;color:#ef4444}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
input,select,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--or);outline:0}input[type=checkbox]{width:auto;accent-color:var(--or)}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tb input{flex:1;min-width:180px}.tb select{width:auto}
.ss{width:auto;padding:4px 6px;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#c9c9cd;white-space:nowrap}.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--mu))}
.mu{color:var(--mu)}.lk{color:var(--or);text-decoration:none;font-weight:500}.lk:hover{text-decoration:underline}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));border:1px solid var(--ln);border-radius:8px;background:var(--s1)}
.strip>div{padding:16px 18px;border-right:1px solid var(--ln)}.strip>div:last-child{border:0}
.strip b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15}.strip span{color:var(--mu);font-size:12px}.strip .hl b{color:var(--or)}
.sec{margin:30px 0 12px;font-size:13px;font-weight:700;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.pipe{display:flex;height:10px;gap:2px;border-radius:3px;overflow:hidden;background:var(--s2)}.pipe i{display:block;min-width:0}
.lg{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.ls{list-style:none;padding:0}.ls li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln)}.ls time{color:var(--mu);font-size:12px;width:96px;flex:none}
.empty{border:1px dashed var(--ln);border-radius:8px;padding:38px 20px;text-align:center;color:var(--mu)}.empty b{color:var(--tx);display:block;margin-bottom:4px;font-size:15px}.empty .btn{margin-top:14px}
.split{display:grid;grid-template-columns:290px 1fr;gap:30px;align-items:start}
.si{padding:10px 12px;border-radius:6px;cursor:pointer;border:1px solid transparent}.si:hover{background:var(--s1)}.si.on{background:var(--s2);border-color:var(--ln);box-shadow:inset 3px 0 var(--or)}.si small{display:block;color:var(--mu)}
.mr{display:grid;grid-template-columns:84px 1fr 108px 120px auto;gap:14px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--ln)}
.ts{font-weight:700;color:var(--or);font-variant-numeric:tabular-nums;text-decoration:none}
.sc{display:flex;gap:2px}.sc i{width:5px;height:14px;background:var(--ln);border-radius:1px}.sc i.f{background:var(--or)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}tr:hover td{background:var(--s1)}.wrap{overflow-x:auto}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.kb h3{font-size:13px;color:var(--mu);margin-bottom:10px}
.note{background:var(--s1);border:1px solid var(--ln);border-left:3px solid var(--p);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.note p{color:#c4c4c8;white-space:pre-wrap;margin:6px 0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.pc{border:1px solid var(--ln);background:var(--s1);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.pc h3{font-size:18px;letter-spacing:-.02em}.pc .n{display:flex;gap:18px}.pc .n b{display:block;font-size:20px;font-weight:800}
.sw{width:42px;height:42px;border-radius:6px;border:1px solid var(--ln);flex:none}
.it{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.it>div{flex:1;min-width:0}
.logo{background:var(--s1);border:1px solid var(--ln);border-radius:8px;padding:26px;text-align:center}.logo img{width:min(100%,300px);border-radius:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ln);border-left:1px solid var(--ln)}
.cal>div{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);min-height:100px;padding:6px;cursor:pointer}
.cal .h{min-height:0;cursor:default;color:var(--mu);font-size:12px;font-weight:600}.cal .o{opacity:.4}.cal .td{background:#1c130a}.cal .td .d{color:var(--or);font-weight:800}
.cal .d{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}.cal .dr{background:#2a1a0a}
.ch{display:block;font-size:11px;padding:2px 6px;margin-bottom:3px;border-radius:3px;background:var(--s2);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.wk>div{border-top:2px solid var(--ln);padding-top:8px}.wk .t{border-color:var(--or)}
.wk label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:var(--s1);border:1px solid var(--ln);border-radius:10px;width:min(540px,100%);max-height:92vh;overflow:auto;padding:24px;animation:pop .16s}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.md h3{font-size:18px;margin-bottom:6px}.md label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}.act{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--or);color:#140800;font-weight:600;padding:9px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:20}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){#app{flex-direction:column}aside{width:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--ln);gap:8px}
.brand{padding:0 8px 0 0}.brand small{display:none}.brand img{width:36px;height:36px}.brand b{white-space:nowrap}nav{display:flex;flex:none}nav a{white-space:nowrap}
nav a.on::before{left:10px;right:10px;top:auto;bottom:0;height:2px;width:auto}main{padding:22px 16px 70px}
.cols,.split,.kb{grid-template-columns:1fr}.mr{grid-template-columns:76px 1fr}.mr>:nth-child(n+3){grid-column:2}.cal>div{min-height:64px;padding:3px}.ch{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><aside><div class="brand"><img id="lg" alt="GLIGIMP4"><div><b>GLIGIMP4 HQ</b><small>Clipping workspace</small></div></div><nav></nav><div><button class="btn sm" data-a="data">Podaci</button> <button class="btn sm" data-a="out" id="ob" style="display:none">Odjava</button><div class="mu" id="sy" style="font-size:11px;margin-top:6px"></div></div></aside><main></main></div><div id="toast"></div>

return `<div class="w">${head('Ideas & Notes','Ideje, hookovi, naslovi, serijali i beleške.',addBtn('ideas'))}<div class="tb">${srch('iq','Pretraži beleške…')}${sel('it','Svi tipovi',CO('idea'))}</div>
${S.ideas.length?`<div class="kb">${['Nova','U radu','Završena'].map(s=>`<div><h3>${s} (${L.filter(x=>x.status==s).length})</h3>${L.filter(x=>x.status==s).map(x=>`<div class="note" style="--p:${COL[x.prio]}"><b>${E(x.title)}</b><div class="mu" style="font-size:12px">${E(x.type)} · ${E(x.prio)}${x.streamerId?' · '+E(lab('streamers',x.streamerId)):''}</div><p>${E(x.body)}</p><div class="row" style="justify-content:space-between">${stOpt('ideas',x.id,'status',['Nova','U radu','Završena'],x.status)}${acts('ideas',x.id)}</div></div>`).join('')}</div>`).join('')}</div>`:empty('Nema zapisa','Zapiši prvu ideju za klip, hook ili serijal.',addBtn('ideas'))}</div>`};
V.brand=()=>`<div class="w">${head('Branding','Vizuelni identitet GLIGIMP4 brenda.')}
<div class="cols"><div class="logo"><img src="${LOGO}" alt="GLIGIMP4 Clips logo"><p class="mu" style="margin-top:14px">Primarni logo. Ne menjati, ne razvlačiti, uvek na tamnoj pozadini.</p></div>
<div><div class="sec" style="margin-top:0">Brand boje ${addBtn('colors','+ Boja')}</div>${S.colors.map(c=>`<div class="it"><span class="sw" style="background:${/^#[0-9a-f]{3,8}$/i.test(c.hex)?c.hex:'transparent'}"></span><div><b>${E(c.name)}</b> <span class="mu">${E(c.hex.toUpperCase())}</span><div class="mu" style="font-size:12px">${E(c.use)}</div></div>${acts('colors',c.id)}</div>`).join('')||'<p class="mu">Nema boja.</p>'}</div></div>
<div class="cols"><div><div class="sec">Tipografija</div><textarea data-b="fonts" rows="2">${E(S.fonts)}</textarea><div style="margin-top:16px;font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.1">Clip every moment.</div><div style="margin-top:6px;color:var(--mu)">Inter 400 — tekst u opisima, beleškama i tabelama.</div></div>
<div><div class="sec">Brand guidelines</div><textarea data-b="rules" rows="6" placeholder="Pravila: ton, format klipova, naslovnice, titlovi, vodeni žig…">${E(S.rules)}</textarea></div></div>
<div class="sec">Dizajn materijali ${addBtn('links','+ Link')}</div>${S.links.map(l=>`<div class="it"><div>${ext(l.url,E(l.name))}<div class="mu" style="font-size:12px">${E(l.note)}</div></div>${acts('links',l.id)}</div>`).join('')||empty('Nema linkova','Sačuvaj linkove ka thumbnailima, overlay-ima i brand fajlovima.')}</div>`;
V.projects=()=>`<div class="w">${head('Projects / Streamers','Svaki strimer je zaseban projekat.',addBtn('streamers'))}
${S.streamers.length?`<div class="g">${S.streamers.map(s=>{const ids=S.streams.filter(x=>x.streamerId==s.id).map(x=>x.id),cl=S.clips.filter(x=>x.streamerId==s.id);
return `<div class="pc"><div class="row" style="justify-content:space-between"><h3>${E(s.name)}</h3>${tag(s.status)}</div><div class="mu">${E(s.desc)}</div>
<div class="n"><span><b>${ids.length}</b><span class="mu">streamova</span></span><span><b>${S.moments.filter(m=>ids.includes(m.streamId)).length}</b><span class="mu">momenata</span></span><span><b>${cl.length}</b><span class="mu">klipova</span></span><span><b>${fmt(cl.reduce((a,x)=>a+(+x.views||0),0))}</b><span class="mu">pregleda</span></span></div>
<div class="row" style="gap:14px">${ext(s.yt,'YouTube')}${ext(s.tt,'TikTok')}${ext(s.other,'Link')}</div>${s.notes?`<div class="mu" style="white-space:pre-wrap;font-size:13px">${E(s.notes)}</div>`:''}
<div class="row" style="justify-content:space-between;margin-top:auto"><button class="btn sm" data-a="go" data-id="${s.id}">Otvori u trackeru</button>${acts('streamers',s.id)}</div></div>`}).join('')}</div>`:empty('Još nema strimera','Dodaj prvog strimera da otvoriš projekat.',addBtn('streamers'))}</div>`;
V.calendar=()=>{const now=new Date(),td=ymd(now);const[y,m]=(S.ui.cal||td.slice(0,7)).split('-').map(Number),f=new Date(y,m-1,1),st=new Date(y,m-1,1-((f.getDay()+6)%7)),D=['Pon','Uto','Sre','Čet','Pet','Sub','Ned'];
const pl=k=>S.posts.filter(p=>p.date==k).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const cells=[...Array(42)].map((_,i)=>{const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i),k=ymd(d);
return `<div class="${d.getMonth()!=m-1?'o':''} ${k==td?'td':''}" data-a="add" data-c="posts" data-d="${k}" data-day="${k}"><span class="d">${d.getDate()}</span>${pl(k).map(p=>`<span class="ch" draggable="true" data-drag="${p.id}" data-a="edit" data-c="posts" data-id="${p.id}" style="--c:${COL[p.status]}">${E(p.time||'')} ${E(p.title)}</span>`).join('')}</div>`}).join('');
const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
return `<div class="w">${head('Content Calendar','Planiraj termine objava. Prevuci objavu na drugi dan da je pomeriš.',addBtn('posts'))}
<div class="row" style="margin-bottom:14px"><button class="btn sm" data-a="cm" data-d="-1">Prethodni</button><b style="min-width:150px;text-align:center">${new Date(y,m-1).toLocaleDateString('sr-Latn',{month:'long',year:'numeric'})}</b><button class="btn sm" data-a="cm" data-d="1">Sledeći</button><button class="btn sm" data-a="cm" data-d="0">Danas</button></div>
<div class="cal">${D.map(d=>`<div class="h">${d}</div>`).join('')}${cells}</div>
<div class="sec">Ova nedelja</div><div class="wk">${D.map((n,i)=>{const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),k=ymd(d);return `<div class="${k==td?'t':''}"><b>${n} ${d.getDate()}.</b>${pl(k).map(p=>`<label><input type="checkbox" data-a="done" data-id="${p.id}"${p.status=='Objavljeno'?' checked':''}><span>${E(p.time||'')} ${E(p.title)}</span></label>`).join('')||'<div class="mu">—</div>'}</div>`}).join('')}</div></div>`};
const NAV=[['dashboard','Dashboard'],['tracker','Stream Tracker'],['clips','Clip Library'],['ideas','Ideas & Notes'],['brand','Branding'],['projects','Projects'],['calendar','Calendar']];
function render(){const k=V[location.hash.slice(1)]?location.hash.slice(1):'dashboard';
$('nav').innerHTML=NAV.map(([h,t])=>`<a href="#${h}" class="${h==k?'on':''}">${t}</a>`).join('');
const a=document.activeElement,f=a&&a.dataset&&a.dataset.f,p=a&&a.selectionStart;
$('main').innerHTML=V[k]();if(f){const n=document.querySelector(`[data-f="${f}"]`);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}}}
function dataModal(){modal(`<h3>Podaci</h3><p class="mu">Sve se automatski čuva u ovom browseru. JSON kopija služi za bekap ili prenos na drugi uređaj.</p><label>JSON</label><textarea id="js" rows="9" style="font:12px monospace">${E(JSON.stringify(S,null,1))}</textarea><input type="file" id="fi" accept=".json" style="display:none">
<div class="act" style="justify-content:space-between"><button class="btn sm d" data-a="wipe">Obriši sve</button><span class="row"><button class="btn" data-a="pf">Učitaj fajl</button><button class="btn" data-a="cp">Kopiraj</button><button class="btn pri" data-a="imp">Uvezi</button></span></div>`);
$('#fi').onchange=e=>{const f=e.target.files[0];f&&f.text().then(t=>$('#js').value=t)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const{a,c,id,d}=b.dataset;
if(a=='x')shut();else if(a=='add')add(c,d?{date:d}:{});else if(a=='edit')form(c,id);else if(a=='del')del(c,id);
else if(a=='pick'){S.ui.stream=id;save();render()}
else if(a=='go'){S.ui.sf=id;S.ui.stream='';save();location.hash='tracker';render()}
else if(a=='nc'){const i=b.parentNode.querySelector('.nc'),v=i.value.trim();if(!v)return;const L=S.cats[c];if(!L.includes(v))L.push(v);b.parentNode.querySelector('select').innerHTML=L.map(o=>`<option${o==v?' selected':''}>${E(o)}</option>`).join('');i.value='';save()}
else if(a=='done'){const p=S.posts.find(x=>x.id==id);p.status=b.checked?'Objavljeno':'Planirano';log(p.status+': '+p.title);save();render()}
else if(a=='cm'){const t=ymd(new Date()).slice(0,7);let[y,m]=(S.ui.cal||t).split('-').map(Number);if(d=='0')S.ui.cal=t;else{const n=new Date(y,m-1+ +d,1);S.ui.cal=ymd(n).slice(0,7)}save();render()}
else if(a=='data')dataModal();
else if(a=='out')ask('Odjava briše lokalnu kopiju na ovom uređaju. Podaci ostaju u cloudu.',()=>{setSess(null);S=def();lsave();location.reload()},'Odjavi se');
else if(a=='pf')$('#fi').click();
else if(a=='cp'){$('#js').select();try{document.execCommand('copy');toast('Kopirano')}catch(x){toast('Označeno — pritisni Ctrl+C')}}
else if(a=='imp'){try{const j=JSON.parse($('#js').value);if(!j||!Array.isArray(j.streamers)||!Array.isArray(j.clips))throw 0;S={...def(),...j};save();shut();render();toast('Podaci uvezeni')}catch(x){toast('Nevažeći GLIGIMP4 JSON')}}
else if(a=='wipe')ask('Obrisati <b>sve</b> podatke iz aplikacije? Prvo napravi JSON kopiju.',()=>{S=def();save();render()},'Obriši sve')});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f){S.ui[t.dataset.f]=t.value;save();render()}else if(t.dataset.b){S[t.dataset.b]=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.s){const[c,id,k]=t.dataset.s.split(':'),r=S[c].find(x=>x.id==id);r[k]=t.value;log(SC[c].one+' „'+lab(c,id)+'“ → '+t.value);save();render()}});
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(t)e.dataTransfer.setData('text',t.dataset.drag)});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-day]');if(c){e.preventDefault();c.classList.add('dr')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-day]');c&&c.classList.remove('dr')});
document.addEventListener('drop',e=>{const c=e.target.closest('[data-day]');if(!c)return;e.preventDefault();const p=S.posts.find(x=>x.id==e.dataTransfer.getData('text'));if(p){p.date=c.dataset.day;log('Pomeren termin: '+p.title+' → '+dfmt(p.date));save();render()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')shut()});
addEventListener('hashchange',render);$('#lg').src=LOGO;render();
if(CLOUD){$('#ob').style.display='';sess?pull():loginUI();const sy=()=>pending?push():pull();addEventListener('focus',sy);document.addEventListener('visibilitychange',()=>document.visibilityState=='visible'&&sy())}
</script></body></html>
